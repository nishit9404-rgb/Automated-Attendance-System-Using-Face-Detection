{% extends "base.html" %}

{% block content %}
  <section class="card">
    <h1>Login</h1>
    <form method="post" class="form">
      <label>
        Username
        <input type="text" name="username" required />
      </label>
      <label>
        Password
        <input type="password" name="password" required />
      </label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </section>
{% endblock %}
